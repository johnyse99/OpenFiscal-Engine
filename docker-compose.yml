version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: openfiscal-postgres
    environment:
      POSTGRES_USER: openfiscal_user
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: openfiscal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfiscal_user -d openfiscal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openfiscal-engine
    ports:
      - "8080:8080"
    environment:
      # Override Spring Boot properties via environment variables to connect to PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/openfiscal_db
      SPRING_DATASOURCE_USERNAME: openfiscal_user
      SPRING_DATASOURCE_PASSWORD: secure_password_123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: